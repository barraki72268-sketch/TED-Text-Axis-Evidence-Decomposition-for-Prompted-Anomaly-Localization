name: Reproduction contracts

on:
  push:
    branches: [main, codex/all-model-reproduction]
    paths: [reproduction/**, ted/inference/**, ted/cted/**, tests/test_reproduction*.py, tests/test_aaclip_inference.py, tests/test_inference.py, tests/test_api.py, tests/test_gateway.py, deployment/pilab-model-registry.json, deployment/gateway.pilab.compose.yaml, deployment/requirements-api.txt, .gitattributes, .github/workflows/reproduction-contract.yml]
  pull_request:
    paths: [reproduction/**, ted/inference/**, ted/cted/**, tests/test_reproduction*.py, tests/test_aaclip_inference.py, tests/test_inference.py, tests/test_api.py, tests/test_gateway.py, deployment/pilab-model-registry.json, deployment/gateway.pilab.compose.yaml, deployment/requirements-api.txt, .gitattributes, .github/workflows/reproduction-contract.yml]

permissions:
  contents: read

jobs:
  figure3-archival-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install CPU diagnostic metric dependencies
        run: python -m pip install numpy==1.25.0 scikit-learn==1.7.2
      - name: Recompute six archived Figure 3 annotations (not fresh model inference)
        run: python -m reproduction.axis_figure --references --output figure3-audit.json
      - name: Audit published fresh arrays and preserve their exact mismatch (no GPU inference)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from reproduction.axis_fresh import audit
          report = audit(Path('reproduction'))
          assert report['evidence_bindings_verified']
          assert len(report['rows']) == 6
          assert report['comparison']['all_annotations_match_3dp']
          assert not report['comparison']['all_arrays_exact']
          assert report['status'] == 'mismatch'
          Path('figure3-fresh-audit.json').write_text(json.dumps(report, indent=2))
          PY
      - name: Check Figure 4 fresh-array comparison rejects incorrect stored AUCs
        run: python -m unittest discover -s tests -p "test_reproduction_rawclip_focus.py" -v
      - name: Audit Figure 4 archived AUCs and preserve NumPy1.25 percentile differences
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from reproduction.rawclip_focus import audit
          report = audit(Path('reproduction'))
          assert len(report['statistics']) == 30
          assert sum(row['matches_exact'] for row in report['statistics']) == 20
          assert len(report['aucs']) == 6
          assert all(row['matches_exact'] for row in report['aucs'])
          assert report['status'] == 'mismatch'
          Path('figure4-archival-audit.json').write_text(json.dumps(report, indent=2))
          PY
      - name: Audit full-target Figure 4 fresh arrays and preserve mismatches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from reproduction.rawclip_focus_fresh import audit
          report = audit(Path('reproduction'))
          comparison = report['comparison']
          assert report['evidence_bindings_verified']
          assert not report['fresh_gpu_execution_verified']
          assert comparison['fresh_summary_independently_verified']
          assert all(row['matches_archive_3dp'] for row in comparison['aucs'])
          assert not any(row['exact_match'] for row in comparison['arrays'])
          assert report['status'] == 'mismatch'
          Path('figure4-fresh-audit.json').write_text(json.dumps(report, indent=2))
          PY
  inference-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install CPU readout and HTTP contract dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.25.0 scipy==1.14.0 pillow==12.0.0 -r deployment/requirements-api.txt
      - name: Compare AA readout against archived evaluator functions
        run: python -m unittest discover -s tests -p "test_aaclip_inference.py" -v
      - name: Check FAPrompt frozen readout contracts
        run: python -m unittest discover -s tests -p "test_inference.py" -v
      - name: Compare captured AdaptCLIP branches against the archived output block
        run: python -m unittest discover -s tests -p "test_adaptclip_inference.py" -v
      - name: Check AdaptCLIP path-only source relocation
        run: python -m unittest discover -s tests -p "test_adaptclip_relocation.py" -v
      - name: Check API category selection, map encoding, limits, and concurrency
        run: python -m unittest discover -s tests -p "test_api.py" -v
      - name: Check model gateway selection, artifact identity, and admission
        run: python -m unittest discover -s tests -p "test_gateway.py" -v
  reference-integrity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Check metric units, method coverage, and standard deviations
        run: python -m unittest discover -s tests -p "test_reproduction*.py" -v
      - name: Verify archived reference integrity (not a GPU benchmark)
        run: python -m reproduction verify-references
      - name: Verify archived research source (not a GPU benchmark)
        run: python -m reproduction verify-source
      - name: Verify historical host-checkpoint bindings (weights not downloaded)
        run: python -m reproduction verify-checkpoints
      - name: Verify traced execution arguments (not a GPU benchmark)
        run: python -m reproduction verify-execution-recipes
      - name: Verify bank catalogs (bank bytes not downloaded)
        run: |
          python -m reproduction verify-source-banks --kind host
          python -m reproduction verify-source-banks --kind raw
          python -m reproduction verify-source-banks --kind weak
