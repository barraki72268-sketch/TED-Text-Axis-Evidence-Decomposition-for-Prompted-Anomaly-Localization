name: Reproduction contracts

on:
  push:
    branches: [main, codex/all-model-reproduction]
    paths: [reproduction/**, tests/test_reproduction*.py, .gitattributes, .github/workflows/reproduction-contract.yml]
  pull_request:
    paths: [reproduction/**, tests/test_reproduction*.py, .gitattributes, .github/workflows/reproduction-contract.yml]

permissions:
  contents: read

jobs:
  reference-integrity:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Check metric units, method coverage, and standard deviations
        run: python -m unittest discover -s tests -p "test_reproduction*.py" -v
      - name: Verify archived reference integrity (not a GPU benchmark)
        run: python -m reproduction verify-references
      - name: Verify archived research source (not a GPU benchmark)
        run: python -m reproduction verify-source
      - name: Verify historical host-checkpoint bindings (weights not downloaded)
        run: python -m reproduction verify-checkpoints
